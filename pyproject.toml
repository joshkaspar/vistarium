[project]
name = "vistarium"
version = "0.1.0"
description = "Public domain / open-access landscape photograph curator (NPS first, more sources later)"
authors = [
    { name = "joshkaspar" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Heavy (torch/transformers, ~1-2GB) -- deliberately not a core dependency.
# Install with `uv sync --extra aesthetic` on a machine with room for it
# (this project runs it on wopr, not the dev VM). See aesthetic_score.py.
aesthetic = [
    "simple-aesthetics-predictor>=0.1.2",
    "transformers>=4.57.0",
    "torch>=2.13.0",
]
# Local-only duplicate-review tooling (scripts/find_duplicates.py,
# scripts/dedup_review_server.py) -- never runs on wopr or ships to
# the public site, so kept separate from the core dependency set.
dedup = [
    "flask>=3.1.0",
]

[project.urls]
Issues = "https://github.com/joshkaspar/vistarium/issues"

[project.scripts]
vistarium = "vistarium:main"
vistarium-build-site = "vistarium.build_site:main"
vistarium-score-aesthetics = "vistarium.aesthetic_score:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# GBNF grammar and the model prompt are long single-line/single-block
# literals by nature -- wrapping them would make the actual grammar
# harder to read, not easier.
"src/vistarium/model_client.py" = ["E501"]
# Inline HTML/CSS/JS template string for the local-only review UI --
# same reasoning as model_client.py above.
"scripts/dedup_review_server.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
